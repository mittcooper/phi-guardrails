<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1160" viewBox="0 0 980 1160" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803D"/>
    </marker>
  </defs>
  <rect width="980" height="1160" fill="#FFFFFF"/>

  <text x="490" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2937">How the gate reaches CI — the loop, the tax, and the way out</text>
  <text x="490" y="56" text-anchor="middle" font-size="12" fill="#6B7280">Everything below follows from one choice: is the gate invoked as a test, or not?</text>

  <!-- ============ PANEL A ============ -->
  <rect x="40" y="76" width="900" height="300" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="60" y="102" font-size="14" font-weight="700" fill="#991B1B">A · Gate invoked as a test, adapter placed in a tests-role package → infinite loop</text>

  <rect x="62" y="150" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="152" y="173" text-anchor="middle" font-size="12" fill="#1F2937">smalltalkCI runs</text>
  <text x="152" y="190" text-anchor="middle" font-size="12" fill="#1F2937">the test packages</text>

  <rect x="300" y="150" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="390" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">Adapter test</text>
  <text x="390" y="190" text-anchor="middle" font-size="12" fill="#374151">runs the gate</text>

  <rect x="580" y="150" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="670" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">Gate run</text>

  <rect x="580" y="280" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="670" y="303" text-anchor="middle" font-size="12" fill="#1F2937">Behavioral check runs</text>
  <text x="670" y="320" text-anchor="middle" font-size="12" fill="#1F2937">the tests-role suites</text>

  <rect x="300" y="280" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="390" y="303" text-anchor="middle" font-size="12" fill="#1F2937">Phi-*-Tests-*</text>
  <text x="390" y="320" text-anchor="middle" font-size="11.5" fill="#374151">holds the adapter</text>

  <g stroke="#1F2937" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="242" y1="178" x2="296" y2="178"/>
  </g>
  <g stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#arRed)">
    <line x1="480" y1="178" x2="576" y2="178"/>
    <line x1="670" y1="206" x2="670" y2="276"/>
    <line x1="576" y1="308" x2="484" y2="308"/>
    <line x1="390" y1="276" x2="390" y2="210"/>
  </g>
  <text x="530" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">∞ never terminates</text>
  <text x="530" y="262" text-anchor="middle" font-size="11" fill="#991B1B">each pass is a fresh, correct run — nothing accumulates to stop it</text>
  <text x="332" y="245" text-anchor="middle" font-size="11" fill="#991B1B">contains</text>

  <!-- ============ PANEL B ============ -->
  <rect x="40" y="396" width="900" height="356" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
  <text x="60" y="422" font-size="14" font-weight="700" fill="#92400E">B · Today's fix — move the adapter to an exempt package (the tax every project pays)</text>

  <rect x="62" y="500" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="142" y="532" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">smalltalkCI</text>

  <rect x="300" y="452" width="200" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="400" y="473" text-anchor="middle" font-size="12" fill="#1F2937">Phi-*-Tests-*</text>
  <text x="400" y="490" text-anchor="middle" font-size="11.5" fill="#374151">tests role</text>

  <rect x="300" y="562" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <text x="400" y="583" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">Phi-*-CI-Tests</text>
  <text x="400" y="600" text-anchor="middle" font-size="11.5" fill="#374151">exempt role · holds the adapter</text>

  <rect x="600" y="562" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="685" y="594" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">Gate run</text>

  <rect x="600" y="452" width="170" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="685" y="473" text-anchor="middle" font-size="12" fill="#1F2937">Behavioral check</text>
  <text x="685" y="490" text-anchor="middle" font-size="11.5" fill="#374151">tests-role only</text>

  <g stroke="#1F2937" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <path d="M 222 516 C 260 510 262 484 296 480"/>
    <path d="M 222 542 C 260 548 262 582 296 588"/>
    <line x1="500" y1="590" x2="596" y2="590"/>
    <line x1="685" y1="562" x2="685" y2="508"/>
    <line x1="596" y1="478" x2="504" y2="478"/>
  </g>

  <path d="M 600 496 C 560 530 520 548 506 560" stroke="#DC2626" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/>
  <text x="556" y="528" font-size="15" font-weight="700" fill="#DC2626">✗</text>
  <text x="556" y="546" text-anchor="middle" font-size="11" fill="#991B1B">never swept — loop broken here</text>

  <text x="60" y="662" font-size="12" font-weight="700" fill="#92400E">The tax, per project (framework and every client alike):</text>
  <text x="60" y="682" font-size="12" fill="#374151">+1 package whose only job is to hold the adapter · +1 exempt role group in the baseline · +1 entry in #exemptNamePatterns · +1 entry in .smalltalk.ston</text>
  <text x="60" y="706" font-size="12" font-weight="700" fill="#92400E">The blind spot:</text>
  <text x="60" y="726" font-size="12" fill="#374151">the gate cannot check this package — that is what exempt means. A `skip` on the adapter disables all enforcement, with no signal.</text>

  <!-- ============ PANEL C ============ -->
  <rect x="40" y="772" width="900" height="330" rx="12" fill="#F0FDF4" stroke="#15803D" stroke-width="1.5"/>
  <text x="60" y="798" font-size="14" font-weight="700" fill="#14532D">C · Options 2 &amp; 3 — the gate is not a test, so the loop cannot form</text>

  <rect x="62" y="880" width="120" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="122" y="911" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">CI</text>

  <rect x="240" y="828" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#15803D"/>
  <text x="350" y="849" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">1 · smalltalkCI runs tests</text>
  <text x="350" y="866" text-anchor="middle" font-size="11.5" fill="#374151">independent validation</text>

  <rect x="240" y="932" width="220" height="52" rx="8" fill="#FFFFFF" stroke="#15803D"/>
  <text x="350" y="953" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">2 · gate invoked directly</text>
  <text x="350" y="970" text-anchor="middle" font-size="11.5" fill="#374151">shell step, or smalltalkCI load hook</text>

  <rect x="530" y="932" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="605" y="963" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">Gate run</text>

  <rect x="530" y="828" width="150" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="605" y="849" text-anchor="middle" font-size="12" fill="#1F2937">Behavioral check</text>
  <text x="605" y="866" text-anchor="middle" font-size="11.5" fill="#374151">tests-role suites</text>

  <rect x="750" y="880" width="180" height="52" rx="8" fill="#FFFFFF" stroke="#4B5563"/>
  <text x="840" y="901" text-anchor="middle" font-size="12" fill="#1F2937">Phi-*-Tests-*</text>
  <text x="840" y="918" text-anchor="middle" font-size="11.5" fill="#374151">tests role — no adapter inside</text>

  <g stroke="#15803D" stroke-width="1.6" fill="none" marker-end="url(#arGreen)">
    <path d="M 182 896 C 210 880 214 858 236 854"/>
    <path d="M 182 916 C 210 932 214 954 236 958"/>
    <line x1="460" y1="958" x2="526" y2="958"/>
    <line x1="605" y1="932" x2="605" y2="884"/>
    <path d="M 680 854 C 720 854 730 886 746 898"/>
    <path d="M 460 850 C 500 812 700 806 800 812 C 860 816 878 850 884 876"/>
  </g>

  <text x="60" y="1030" font-size="12" font-weight="700" fill="#14532D">What disappears:</text>
  <text x="60" y="1050" font-size="12" fill="#374151">the exempt CI-Tests package (for everyone) · the no-self-sweep rule · the recursion hazard · the reviewer-enforced conventions · the silent-disarm blind spot</text>
  <text x="60" y="1074" font-size="12" font-weight="700" fill="#14532D">What is preserved:</text>
  <text x="60" y="1094" font-size="12" fill="#374151">step 1 still runs the tests without the gate — the independent path that stops a broken gate from hiding the tests that would catch it.</text>
</svg>
